[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "0.1.0"
description = "GetVoIP RAG service — ingestion and retrieval"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "qdrant-client>=1.13,<1.14",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
rerank = [
    "sentence-transformers>=3.0",
]

[project.scripts]
rag-normalize = "app.ingestion.normalize:main"
rag-chunk = "app.ingestion.chunk:main"
rag-index = "app.ingestion.index:main"
rag-ingest = "app.ingestion.ingest:main"
rag-eval = "app.evaluation.run:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
