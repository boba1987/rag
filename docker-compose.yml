version: "3.7"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__MAX_WORKERS: "2"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
